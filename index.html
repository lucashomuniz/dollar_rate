<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="USD/BRL">
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Dólar Americano → Real Brasileiro</title>
<style>
:root{--bg:#0b0b0d;--fg:#fff;--mut:#8e8e93;--card:#1c1c1e;--up:#34c759;--down:#ff453a;--c:#ff453a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
body{display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 20px) 24px calc(env(safe-area-inset-bottom) + 20px)}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
h1{font-size:clamp(24px,4.2vw,38px);font-weight:700;letter-spacing:-.02em}
.sub{display:flex;align-items:baseline;gap:14px;margin-top:6px;flex-wrap:wrap}
#price{font-size:clamp(26px,4.4vw,40px);color:var(--mut);font-variant-numeric:tabular-nums}
#chg{font-size:clamp(22px,3.6vw,34px);font-weight:600;color:var(--c);font-variant-numeric:tabular-nums}
#chgLbl{font-size:15px;color:var(--mut)}
#timeRow{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--mut)}
#rf{background:none;border:0;color:var(--mut);cursor:pointer;padding:6px;margin:-6px;line-height:0}
#rf:hover{color:var(--fg)}
#rf svg{width:1em;height:1em;font-size:13px}
#rf.spin svg{animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.cards{display:flex;gap:10px}
.card{background:var(--card);border-radius:18px;padding:14px 19px;min-width:175px}
.card{position:relative}
#eye{position:absolute;top:8px;right:8px;background:none;border:0;color:var(--mut);cursor:pointer;padding:4px;line-height:0}
#eye:hover{color:var(--fg)}
.card .l{font-size:14px;color:var(--mut)}
.card .v{font-size:26px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums}
.card .s{font-size:13px;color:var(--mut);margin-top:2px}
#wrap{position:relative;flex:1;min-height:200px;margin:18px -24px 14px}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#tip{position:absolute;top:0;pointer-events:none;background:var(--card);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;display:none;transform:translateX(-50%)}
#tip b{font-size:15px;font-variant-numeric:tabular-nums}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:14px}
nav{display:flex;justify-content:space-between;background:#1c1c1e;border-radius:22px;padding:5px;max-width:560px;width:100%;margin:0 auto}
nav button{flex:1;background:none;border:0;color:var(--fg);font-size:17px;padding:9px 0;border-radius:18px;cursor:pointer;font-family:inherit}
nav button.on{background:#48484a}
@media (max-width:640px){header{flex-direction:column}.cards{width:100%}.card{flex:1;min-width:0}.card .v{font-size:21px;white-space:nowrap}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Dólar Americano → Real Brasileiro</h1>
    <div class="sub"><span id="price">R$ —</span><span id="chg"></span><span id="chgLbl"></span></div>
    <div id="timeRow"><span id="time"></span><button id="rf" aria-label="Refresh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button></div>
  </div>
  <div class="cards">
    <div class="card"><div class="l">Higlobe Rate (VET)</div><div class="v" id="hg">—</div><div class="s">commercial − 0.20% spread</div></div>
    <div class="card"><button id="eye" aria-label="Show or hide salary"></button><div class="l">Expected Salary</div><div class="v" id="sal">—</div><div class="s" id="salUsd">US$ 2.508,34</div></div>
  </div>
</header>
<div id="wrap"><canvas id="cv"></canvas><div id="tip"></div><div id="msg">Loading…</div></div>
<nav id="nav">
  <button data-r="1D">1D</button><button data-r="1W">1W</button><button data-r="1M">1M</button><button data-r="3M" class="on">3M</button><button data-r="6M">6M</button><button data-r="1Y">1Y</button><button data-r="2Y">2Y</button>
</nav>
<script>
const SALARY_USD = 2508.34;          // valor recebido em USD
const HIGLOBE_SPREAD = 0.0020;       // 0,20% (higlobe.com/pricing), sem IOF e sem tarifas
const API = 'https://economia.awesomeapi.com.br/json';
const LIVE = 'https://scanner.tradingview.com/forex/scan';
const REFRESH_MS = 15000;
const DAYS = {'1W':7,'1M':30,'3M':91,'6M':182,'1Y':365,'2Y':730};

const $ = id => document.getElementById(id);
const fmt = (v,d=4) => v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const brt = (ms,o) => new Date(ms).toLocaleString('en-US',Object.assign({timeZone:'America/Sao_Paulo'},o));

const EYE_ON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
let salHidden = false, salBrl = '—';
function renderSalary(){
  $('sal').textContent = salHidden ? 'R$ ******' : salBrl;
  $('salUsd').textContent = salHidden ? 'US$ ******' : 'US$ ' + fmt(SALARY_USD, 2);
  $('eye').innerHTML = salHidden ? EYE_OFF : EYE_ON;
}
let range = '3M', last = null, daily = null, intraday = null, pts = [], hover = -1;

async function get(url){ const r = await fetch(url,{cache:'no-store'}); if(!r.ok) throw new Error(r.status); return r.json(); }

// Live quote: ICE Data (FX_IDC:USDBRL) via TradingView scanner, ~real time. Fallback: AwesomeAPI (delayed).
async function loadLast(){
  try {
    const r = await fetch(LIVE, {method:'POST', cache:'no-store', body: JSON.stringify({symbols:{tickers:['FX_IDC:USDBRL']}, columns:['close','change','update_time']})});
    if (!r.ok) throw new Error(r.status);
    const d = (await r.json()).data[0].d;
    if (!(d[0] > 0)) throw new Error('empty');
    last = {bid:+d[0], pct:+d[1], ts:+d[2]*1000};
  } catch (e) {
    const q = (await get(`${API}/last/USD-BRL`)).USDBRL;
    last = {bid:+q.bid, pct:+q.pctChange, ts:+q.timestamp*1000};
  }
  if (intraday && (!intraday.length || last.ts > intraday[intraday.length-1].t)) intraday.push({t:last.ts, v:last.bid});
}
async function loadDaily(){
  if (daily) return;
  const end = new Date(), start = new Date(Date.now() - 740*864e5);
  const d = x => x.toISOString().slice(0,10).replace(/-/g,'');
  const j = await get(`${API}/daily/USD-BRL/1000?start_date=${d(start)}&end_date=${d(end)}`);
  const byDay = new Map();
  j.forEach(x => { const t=+x.timestamp*1000, k=brt(t,{year:'numeric',month:'2-digit',day:'2-digit'}); if(!byDay.has(k)||byDay.get(k).t<t) byDay.set(k,{t,v:+x.bid}); });
  daily = [...byDay.values()].sort((a,b)=>a.t-b.t);
}
async function loadIntraday(){
  const j = await get(`${API}/USD-BRL/1000`);
  const cut = Date.now() - 24*3600e3;
  intraday = j.map(x=>({t:+x.timestamp*1000, v:+x.bid})).filter(p=>p.t>=cut).sort((a,b)=>a.t-b.t);
  if (last && (!intraday.length || last.ts > intraday[intraday.length-1].t)) intraday.push({t:last.ts, v:last.bid});
}

function series(){
  if (range === '1D') return intraday || [];
  const cut = Date.now() - DAYS[range]*864e5;
  const s = (daily||[]).filter(p=>p.t>=cut);
  if (last && s.length) { const k=t=>brt(t,{year:'numeric',month:'2-digit',day:'2-digit'}); if (k(s[s.length-1].t)===k(last.ts)) s[s.length-1]={t:last.ts,v:last.bid}; else if (last.ts > s[s.length-1].t) s.push({t:last.ts, v:last.bid}); }
  return s;
}

function renderHeader(){
  if (!last) return;
  $('price').textContent = 'R$ ' + fmt(last.bid);
  let pct;
  if (range === '1D') pct = last.pct;
  else { const s = series(); pct = s.length>1 ? (s[s.length-1].v/s[0].v - 1)*100 : 0; }
  const up = pct >= 0;
  document.documentElement.style.setProperty('--c', up ? 'var(--up)' : 'var(--down)');
  $('chg').textContent = (up?'↑ ':'↓ ') + fmt(Math.abs(pct),2) + '%';
  $('chgLbl').textContent = range === '1D' ? 'today' : 'in ' + range;
  $('time').textContent = brt(last.ts,{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}) + ' BRT';
  const vet = last.bid * (1 - HIGLOBE_SPREAD);
  $('hg').textContent = 'R$ ' + fmt(vet);
  salBrl = 'R$ ' + fmt(Math.floor(SALARY_USD * vet), 0); renderSalary();
}

const cv = $('cv'), ctx = cv.getContext('2d');
function draw(){
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  pts = [];
  const s = series();
  $('msg').style.display = s.length>1 ? 'none' : 'flex';
  if (s.length < 2) return;
  const col = getComputedStyle(document.documentElement).getPropertyValue(range && (s[s.length-1].v>=s[0].v)?'--up':'--down').trim();
  let mn = Math.min(...s.map(p=>p.v)), mx = Math.max(...s.map(p=>p.v)); const pad=(mx-mn)*.12||.01; mn-=pad; mx+=pad;
  const t0 = s[0].t, t1 = s[s.length-1].t, top = 50, bot = H-8;
  pts = s.map(p=>({x:8+(p.t-t0)/(t1-t0)*(W-16), y:top+(mx-p.v)/(mx-mn)*(bot-top), p}));
  const g = ctx.createLinearGradient(0,top,0,H); g.addColorStop(0,col+'55'); g.addColorStop(1,col+'05');
  ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.lineTo(pts[pts.length-1].x,H); ctx.lineTo(pts[0].x,H); ctx.closePath(); ctx.fillStyle=g; ctx.fill();
  ctx.beginPath(); pts.forEach((q,i)=>i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)); ctx.strokeStyle=col; ctx.lineWidth=2.5; ctx.lineJoin='round'; ctx.stroke();
  const step = (W-16) / (pts.length - 1);
  if (step >= 6) { ctx.fillStyle = col; pts.forEach(q => { ctx.beginPath(); ctx.arc(q.x, q.y, 3, 0, 7); ctx.fill(); }); }
  if (hover>=0 && pts[hover]){
    const q = pts[hover];
    ctx.strokeStyle='#ffffff55'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(q.x,top-10); ctx.lineTo(q.x,H); ctx.stroke();
    ctx.fillStyle=col; ctx.beginPath(); ctx.arc(q.x,q.y,7,0,7); ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.stroke();
    const tip = $('tip'); const opt = range==='1D' ? {hour:'2-digit',minute:'2-digit'} : {day:'2-digit',month:'short',year:'numeric'};
    tip.innerHTML = `<b>R$ ${fmt(q.p.v)}</b> · ${brt(q.p.t,opt)}`;
    tip.style.display='block'; tip.style.left = Math.min(Math.max(q.x, tip.offsetWidth/2+8), W-tip.offsetWidth/2-8)+'px';
  } else $('tip').style.display='none';
}
function pick(e){
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left; if(!pts.length) return;
  let b=0; pts.forEach((q,i)=>{ if(Math.abs(q.x-x)<Math.abs(pts[b].x-x)) b=i; }); hover=b; draw();
}
cv.addEventListener('pointermove',pick); cv.addEventListener('pointerdown',pick);
cv.addEventListener('pointerleave',()=>{hover=-1;draw();}); cv.addEventListener('pointerup',e=>{ if(e.pointerType!=='mouse'){hover=-1;draw();} });
addEventListener('resize',draw);
$('rf').addEventListener('click', async ()=>{ const b=$('rf'); if(b.classList.contains('spin')) return; b.classList.add('spin'); const t0=Date.now(); daily=null; intraday=null; await refresh(true); setTimeout(()=>b.classList.remove('spin'), Math.max(0,600-(Date.now()-t0))); });
$('eye').addEventListener('click',()=>{ salHidden=!salHidden; renderSalary(); });
renderSalary();

$('nav').addEventListener('click', async e=>{
  const b = e.target.closest('button'); if(!b) return;
  document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));
  range = b.dataset.r; hover=-1; await refresh(false);
});

async function refresh(full=true){
  try{
    $('msg').textContent='Loading…';
    await loadLast();
    if (range==='1D') { if(full||!intraday) await loadIntraday(); } else await loadDaily();
    renderHeader(); draw();
  }catch(err){ $('msg').style.display='flex'; $('msg').textContent='No connection to the rate feed. Retrying…'; }
}
refresh();
setInterval(()=>refresh(false), REFRESH_MS);
setInterval(()=>{ intraday=null; }, 300000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ daily=null; intraday=null; refresh(); } });
</script>
</body>
</html>
